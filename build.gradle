plugins {
    id 'java'
    id 'io.qameta.allure' version '2.11.2'
}

group 'ru.netology'
version '1.0-SNAPSHOT'

sourceCompatibility = 11
targetCompatibility = 11

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testImplementation 'com.codeborne:selenide:6.19.1'
    testImplementation 'io.qameta.allure:allure-selenide:2.21.0'
    testImplementation 'mysql:mysql-connector-java:8.0.33'
    testImplementation 'org.postgresql:postgresql:42.5.4'
    testImplementation 'commons-dbutils:commons-dbutils:1.8.1'
    testImplementation 'com.github.javafaker:javafaker:1.0.2'
    testImplementation 'io.github.bonigarcia:webdrivermanager:5.6.3'

    testCompileOnly 'org.projectlombok:lombok:1.18.26'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.26'
}

allure {
    version = '2.21.0'
    useJUnit5 {
        version = '2.21.0'
    }
}

test {
    useJUnitPlatform()
    systemProperty 'selenide.headless', false
    systemProperty 'datasource.url', System.getProperty('datasource.url', 'jdbc:mysql://localhost:3306/app')
    systemProperty 'datasource.username', System.getProperty('datasource.username', 'app')
    systemProperty 'datasource.password', System.getProperty('datasource.password', 'pass')
}